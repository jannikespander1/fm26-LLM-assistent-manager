services:
  postgres:
    image: postgres:16
    container_name: fm26_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm26
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fm26
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
